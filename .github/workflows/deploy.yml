# Generated by aist-infra/scripts/sync-app-deploy.py; edit the infra template.
name: Deploy to core

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Apply to core (false builds/tests only)'
        type: boolean
        default: false
      migrate:
        description: 'Import source env/data once before deploying'
        type: boolean
        default: false
      source_host:
        description: 'Old VPS SSH address'
        default: '194.164.200.218'
      source_user:
        description: 'Old VPS SSH user with Docker and config access'
        default: 'root'
      source_port:
        description: 'Old VPS SSH port'
        default: '22'
      source_path:
        description: 'Absolute application directory on old VPS'
        default: '/root/anondocs'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: core-image-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.existing.outputs.image || steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs
        env:
          APP: anondocs
          DOMAIN: ${{ vars.ANONDOCS_DOMAIN || 'api.anondocs.aismarttalk.tech' }}
          DEPLOY: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CORE_DEPLOY_ENABLED == 'true') }}
          MIGRATE: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate }}
        run: |
          case "$APP" in md-to-pdf|anondocs|anondocs-website) ;; *) exit 2;; esac
          if [[ "$APP" = anondocs-website && "$MIGRATE" = true ]]; then echo 'Static sites have no source state to import'; exit 2; fi
          if [[ "$MIGRATE" = true && "$DEPLOY" != true ]]; then
            echo 'Migration requires deploy=true'; exit 2
          fi
          if [[ "$DEPLOY" = true ]]; then
            [[ "$DOMAIN" =~ ^[A-Za-z0-9][A-Za-z0-9.-]+[A-Za-z0-9]$ ]] || { echo 'Configure the API domain'; exit 2; }
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: ref
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:core-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Reuse the tested commit image
        id: existing
        env:
          IMAGE: ${{ steps.ref.outputs.tag }}
        run: |
          if docker pull "$IMAGE" > "$RUNNER_TEMP/image-pull.log" 2>&1; then
            digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
            [[ "$digest" =~ @sha256:[a-f0-9]{64}$ ]]
            echo "image=$digest" >> "$GITHUB_OUTPUT"
          elif ! grep -qiE 'manifest unknown|no such manifest|not found|denied|unauthorized' "$RUNNER_TEMP/image-pull.log"; then
            echo 'Registry lookup failed; refusing to replace a possibly existing commit image.'
            exit 1
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.image == ''
        with:
          context: .
          load: true
          tags: ${{ steps.ref.outputs.tag }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the production image
        if: steps.existing.outputs.image == ''
        env:
          APP: anondocs
          IMAGE: ${{ steps.ref.outputs.tag }}
        run: |
          if [[ "$APP" = md-to-pdf ]]; then
            docker run -d --name app-ci -p 127.0.0.1:18000:8000 \
              --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
              --memory=1g --cpus=2 --pids-limit=256 --cap-drop=ALL --security-opt=no-new-privileges:true \
              --mount type=volume,source=app-ci-pdf-storage,target=/home/rocket/public/pdf \
              --mount type=volume,source=app-ci-pdf-cache,target=/home/rocket/public/cache \
              --mount "type=bind,source=$GITHUB_WORKSPACE/deploy/run-core.sh,target=/usr/local/bin/run-core.sh,readonly" \
              --entrypoint /bin/sh -e API_KEY=ci-test-key -e PDF_MAX_CONCURRENCY=1 -e XDG_CACHE_HOME=/tmp/.cache "$IMAGE" /usr/local/bin/run-core.sh
            URL=http://127.0.0.1:18000/api/health
          elif [[ "$APP" = anondocs ]]; then
            docker network create app-ci
            docker run -d --name llm-fixture --network app-ci \
              --mount "type=bind,source=$GITHUB_WORKSPACE/deploy/core/infra/tests/ollama-fixture.cjs,target=/fixture.cjs,readonly" \
              --entrypoint node "$IMAGE" /fixture.cjs
            docker run -d --name app-ci --network app-ci -p 127.0.0.1:18000:3000 \
              --memory=512m --cpus=1 --cap-drop=ALL --security-opt=no-new-privileges:true \
              -e DEFAULT_LLM_PROVIDER=ollama -e OLLAMA_BASE_URL=http://llm-fixture:11434 -e OLLAMA_MODEL=fixture "$IMAGE"
            URL=http://127.0.0.1:18000/health
          else
            docker run -d --name app-ci -p 127.0.0.1:18000:8080 \
              --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
              --memory=256m --cpus=0.5 --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges:true "$IMAGE"
            URL=http://127.0.0.1:18000/health
          fi
          healthy=false
          for _ in {1..60}; do
            if curl -fsS --max-time 5 "$URL" > /dev/null; then healthy=true; break; fi
            sleep 2
          done
          [[ "$healthy" = true ]] || { docker logs app-ci; exit 1; }
          if [[ "$APP" = md-to-pdf ]]; then
            API_KEY=ci-test-key bash deploy/test-core-api.sh http://127.0.0.1:18000
          elif [[ "$APP" = anondocs ]]; then
            # Validate API + SSE using a deterministic local provider; no external LLM calls.
            code=$(curl -s -o /tmp/invalid.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:18000/api/anonymize)
            [[ "$code" = 400 ]]
            SMOKE_CONTAINER=app-ci bash deploy/core/infra/scripts/smoke-app.sh anondocs
          else
            bash deploy/test-core-site.sh http://127.0.0.1:18000
          fi
      - name: Publish the tested image
        if: steps.existing.outputs.image == ''
        id: publish
        env:
          IMAGE: ${{ steps.ref.outputs.tag }}
        run: |
          docker push "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          [[ "$digest" =~ @sha256:[a-f0-9]{64}$ ]]
          echo "image=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CORE_DEPLOY_ENABLED == 'true')
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: core-anondocs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - name: Load the versioned infra bundle
        run: cp -a app/deploy/core/infra infra
      - name: Prepare credentials and payload
        env:
          TARGET_SSH_KEY: ${{ secrets.CORE_SSH_KEY }}
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY || secrets.VPS_SSH_KEY }}
          APP_ENV: ${{ secrets.ANONDOCS_ENV }}
          MIGRATE: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate }}
          SOURCE_HOST: ${{ inputs.source_host }}
          SOURCE_USER: ${{ inputs.source_user }}
          SOURCE_PORT: ${{ inputs.source_port }}
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$TARGET_SSH_KEY" ]] || { echo 'Missing TARGET_SSH_KEY'; exit 1; }
          mkdir -p ~/.ssh payload/app/deploy
          printf '%s\n' "$TARGET_SSH_KEY" > ~/.ssh/target
          printf '%s\n' "$SOURCE_SSH_KEY" > ~/.ssh/source
          printf '%s\n' "$APP_ENV" > payload/app.env
          cp app/docker-compose.core.yml payload/app/docker-compose.prod.yml
          cp -a app/deploy/. payload/app/deploy/
          rm -rf payload/app/deploy/core
          cp -a infra payload/infra
          rm -rf payload/infra/.git
          ssh-keyscan -H 212.132.108.151 >> ~/.ssh/known_hosts
          if [[ "$MIGRATE" = true ]]; then
            [[ "$SOURCE_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$SOURCE_HOST" != 212.132.108.151 ]]
            [[ "$SOURCE_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ && "$SOURCE_PORT" =~ ^[0-9]+$ ]]
            [[ "$SOURCE_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$SOURCE_PATH" != / && -n "$SOURCE_SSH_KEY" ]]
            ssh-keyscan -p "$SOURCE_PORT" -H "$SOURCE_HOST" >> ~/.ssh/known_hosts
          fi
      - name: Import source state once
        if: github.event_name == 'workflow_dispatch' && inputs.migrate
        env:
          APP: anondocs
          SOURCE_HOST: ${{ inputs.source_host }}
          SOURCE_USER: ${{ inputs.source_user }}
          SOURCE_PORT: ${{ inputs.source_port }}
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          umask 077
          path="/opt/$APP"
          # Do not export/import again after a successful migration.
          state=$(ssh -i ~/.ssh/target -o BatchMode=yes -o ConnectTimeout=15 root@212.132.108.151 "if test -f '$path/.migration-imported'; then echo imported; else echo new; fi")
          if [[ "$state" = imported ]]; then
            echo 'State already imported; proceeding with a normal deploy.'
            exit 0
          fi
          ssh -i ~/.ssh/source -o BatchMode=yes -o ConnectTimeout=15 -p "$SOURCE_PORT" "$SOURCE_USER@$SOURCE_HOST"             "bash -s -- '$APP' '$SOURCE_PATH'" < infra/scripts/export-state.sh > "$RUNNER_TEMP/state.tar.gz"
          mkdir payload/import
          tar -xzf "$RUNNER_TEMP/state.tar.gz" -C payload/import
          rm -f "$RUNNER_TEMP/state.tar.gz"
      - name: Apply release
        env:
          APP: anondocs
          DOMAIN: ${{ vars.ANONDOCS_DOMAIN || 'api.anondocs.aismarttalk.tech' }}
          IMAGE: ${{ needs.image.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          release="/opt/.aist-releases/$APP-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_target=(ssh -i ~/.ssh/target -o BatchMode=yes -o ConnectTimeout=15 root@212.132.108.151)
          "${ssh_target[@]}" "umask 077; mkdir -p '$release'"
          tar -C payload -czf - . | "${ssh_target[@]}" "tar -xzf - -C '$release'"
          "${ssh_target[@]}" "bash '$release/infra/scripts/prepare-release.sh' '$release'"
          printf '%s' "$GH_TOKEN" | "${ssh_target[@]}" "docker --config '$release/auth' login ghcr.io -u '$GH_USER' --password-stdin"
          "${ssh_target[@]}" "DOCKER_CONFIG='$release/auth' flock -w 600 /var/lock/aist-core-deploy.lock bash '$release/infra/scripts/apply-app.sh' '$APP' '$release' '$IMAGE' '$DOMAIN'"
      - name: Summary
        env:
          APP: anondocs
          DOMAIN: ${{ vars.ANONDOCS_DOMAIN || 'api.anondocs.aismarttalk.tech' }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          {
            echo "Application: $APP"
            echo "Image: $IMAGE"
            echo "Target ready over Docker HTTP. Change the domain A record to 212.132.108.151 on OVH."
            echo "HTTPS certificate issuance starts when DNS points to the target."
            echo "Run Verify core after DNS propagation: https://$DOMAIN"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clean transient secrets
        if: always()
        env:
          APP: anondocs
        run: |
          rm -rf payload/import payload/app.env "$RUNNER_TEMP/state.tar.gz"
          if [[ -f ~/.ssh/target ]]; then
            release="/opt/.aist-releases/$APP-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            ssh -i ~/.ssh/target -o BatchMode=yes -o ConnectTimeout=15 root@212.132.108.151 "rm -rf '$release'" || true
          fi
          rm -f ~/.ssh/target ~/.ssh/source
