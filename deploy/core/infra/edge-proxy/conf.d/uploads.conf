# Neutral edge proxy global tweaks (http context, applies to every vhost).
# smartstudio handles large video uploads (2g); generous cap is harmless for the
# rest. Per-app overrides still win via their own internal nginx / vhost.d files.
client_max_body_size 2g;

# Don't cut long server work at nginx's default 60s idle read timeout.
# smartstudio's /api/autocut streams NDJSON with >60s SILENT gaps (parallel
# ffmpeg decode passes — one scene-detect pass alone ≈ 51s on a 205 MB rush —,
# Whisper transcription, then a vision call per segment), and /api/transcript +
# /api/analyze are single JSON responses that likewise exceed 60s on large media.
# Past 60s without a byte from upstream the proxy reset the connection →
# "TypeError: network error" in the browser mid-processing. A generous timeout is
# neutral for the other vhosts: it only bites when an upstream is genuinely slow
# to produce bytes.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
